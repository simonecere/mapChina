<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viaggio in Cina — Trip Planner</title>

    <!-- PWA metadata -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#c8332a" />
    <link rel="apple-touch-icon" href="icons/app-icon.jpg" />
    <link rel="icon" href="icons/app-icon.jpg" type="image/jpeg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cina 2027" />

    <!-- Leaflet CSS (CDN ufficiale) -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Font Inter da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- Foglio di stile applicativo -->
    <link rel="stylesheet" href="style.css" />
</head>
<body class="page-map">

    <!-- Mount point del menu di navigazione condiviso.
         menu.js inietta qui il pulsante burger + il drawer.
         Nota: su mobile il burger top-left viene nascosto perché
         un burger sticky viene iniettato dentro la filter bar. -->
    <div id="menu-mount"></div>

    <!-- =========================================================
         Contenitore radice: mappa a schermo intero + sidebar
         flottante sopra come overlay (position absolute).
    ========================================================== -->
    <div class="app-container">

        <!-- =========================================================
             Colonna mappa: contiene la barra filtri, la sub-bar
             espandibile e il div su cui Leaflet monta le tile.
        ========================================================== -->
        <main class="map-wrapper">

            <!-- Barra filtri principale (top-level categories) -->
            <div class="filter-bar" id="filter-bar" role="toolbar" aria-label="Filtri categorie">
                <!-- popolata dinamicamente da renderFilterBar() -->
            </div>

            <!-- Sub-bar: seconda barra che appare sotto la primary
                 con animazione clip-path quando clicchi Esperienze o Servizi. -->
            <div class="sub-bar" id="sub-bar" role="toolbar" aria-label="Sotto-categorie">
                <!-- popolata dinamicamente da openSubBar() -->
            </div>

            <!-- Div su cui Leaflet renderizza le tile della mappa -->
            <div id="map" aria-label="Mappa della Cina"></div>
        </main>

        <!-- =========================================================
             Sidebar flottante (glass panel).
             Parte con classe .is-closed (traslata fuori a destra).
             openSidebar/closeSidebar aggiungono/rimuovono la classe.
             Su mobile diventa un bottom sheet trascinabile.
        ========================================================== -->
        <aside class="sidebar is-closed" id="sidebar"
               aria-label="Dettagli punto di interesse">

            <!-- Handle bar per trascinare la sidebar su mobile.
                 Visibile solo sotto i 900px di viewport (via CSS). -->
            <div class="sidebar-handle" id="sidebar-handle"
                 role="separator" aria-label="Trascina per ridimensionare">
                <div class="sidebar-handle-bar"></div>
            </div>

            <!-- Bottone X di chiusura, sovrapposto in alto a destra -->
            <button
                type="button"
                class="sidebar-close"
                id="sidebar-close"
                aria-label="Chiudi pannello"
                title="Chiudi"
            >
                <svg viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round"
                     stroke-linejoin="round" aria-hidden="true">
                    <line x1="5" y1="5" x2="19" y2="19" />
                    <line x1="19" y1="5" x2="5" y2="19" />
                </svg>
            </button>

            <!-- Pannello dettagli: contiene stato vuoto + contenuto reale.
                 Solo uno dei due è visibile alla volta, gestito via `hidden`. -->
            <section class="detail-panel" id="detail-panel">

                <!-- Stato vuoto: mostrato quando nessun POI è selezionato.
                     In pratica non appare mai perché la sidebar è chiusa
                     di default; resta come fallback difensivo. -->
                <div class="detail-empty" id="detail-empty">
                    <div class="detail-empty-icon" aria-hidden="true">

                        <svg viewBox="0 0 24 24" width="48" height="48"
                             fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round"
                             stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9" />
                            <path d="M15.5 8.5l-2 5-5 2 2-5 5-2z" />
                        </svg>
                    </div>
                    <p>Seleziona un punto sulla mappa per iniziare a esplorare.</p>
                </div>

                <!-- Contenuto reale: gallery + testi + link Maps + eventuali sezioni.
                     Popolato da renderDetail() / renderSectionDetail(). -->
                <article class="detail-content" id="detail-content" hidden>

                    <button
                        type="button"
                        class="detail-back-btn"
                        id="detail-back-btn"
                        hidden
                    >&#8592; Torna</button>

                    <!-- Galleria immagini: scroll orizzontale con snap.
                         Contenuto popolato da renderGallery(). -->
                    <div class="detail-gallery" id="detail-gallery">
                        <div class="gallery-track" id="gallery-track"
                             role="region" aria-label="Galleria immagini">

                        </div>

                        <button type="button"
                                class="gallery-arrow gallery-arrow--prev"
                                id="gallery-prev"
                                aria-label="Immagine precedente">
                            <svg viewBox="0 0 24 24" width="16" height="16"
                                 fill="none" stroke="currentColor"
                                 stroke-width="2.5" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <polyline points="15 18 9 12 15 6" />
                            </svg>
                        </button>
                        <button type="button"
                                class="gallery-arrow gallery-arrow--next"
                                id="gallery-next"
                                aria-label="Immagine successiva">
                            <svg viewBox="0 0 24 24" width="16" height="16"
                                 fill="none" stroke="currentColor"
                                 stroke-width="2.5" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <polyline points="9 18 15 12 9 6" />
                            </svg>
                        </button>

                        <div class="gallery-dots" id="gallery-dots"
                             role="tablist" aria-label="Naviga tra le immagini">

                        </div>
                    </div>
                    <div class="detail-body">
                        <span class="detail-city" id="detail-city"></span>
                        <h2 class="detail-title" id="detail-title"></h2>
                        <div class="detail-tags" id="detail-tags"></div>
                        <p class="detail-description" id="detail-description"></p>
                        <div class="detail-meta" id="detail-meta"></div>

                        <!-- Pulsante "Apri in Google Maps": visibile solo se
                             il POI ha il campo mapsUrl. Aggiornato in JS. -->
                        <a
                            class="maps-btn"
                            id="maps-btn"
                            href="#"
                            target="_blank"
                            rel="noopener noreferrer"
                            hidden
                        >
                            <svg viewBox="0 0 24 24" width="14" height="14"
                                 fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                                <circle cx="12" cy="10" r="3" />
                            </svg>
                            <span>Apri in Google Maps</span>
                        </a>

                        <!-- Pulsante "Calcola distanza": apre la modale
                             per calcolare distanza+tempo dal POI corrente
                             a un altro POI, con scelta del mezzo. -->
                        <button
                            type="button"
                            class="dist-btn"
                            id="dist-btn"
                        >
                            <svg viewBox="0 0 24 24" width="14" height="14"
                                 fill="none" stroke="currentColor"
                                 stroke-width="2" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M21.3 15.3 15 21.6a2 2 0 0 1-2.8 0L2.4 11.8a2 2 0 0 1 0-2.8L8.6 2.7a2 2 0 0 1 2.8 0l9.8 9.8a2 2 0 0 1 .1 2.8Z"/>
                                <path d="M9 8l1 1"/>
                                <path d="M12 5l1 1"/>
                                <path d="M15 8l1 1"/>
                                <path d="M8 13l1 1"/>
                                <path d="M12 16l1 1"/>
                            </svg>
                            <span>Calcola distanza</span>
                        </button>

                        <!-- Elenco sezioni (usato solo per la Muraglia).
                             Popolato in renderSectionButtons(). -->
                        <div class="detail-sections" id="detail-sections" hidden>
                            <h4 class="sections-title">Sezioni visitabili</h4>
                            <div class="section-list" id="section-list"></div>
                        </div>
                    </div>
                </article>
            </section>

        </aside>
    </div>

    <!-- =========================================================
         Modale "Calcola distanza": overlay centrato sopra la mappa.
         Backdrop scuro + card glass; mostra POI di partenza,
         dropdown categoria + POI destinazione, tre mode buttons,
         area risultato.
    ========================================================== -->
    <div class="dist-modal" id="dist-modal" hidden>
        <div class="dist-modal-backdrop" id="dist-modal-backdrop"></div>
        <div class="dist-modal-card" role="dialog" aria-label="Calcola distanza">
            <header class="dist-modal-header">
                <h2 class="dist-modal-title">Calcola distanza</h2>
                <button type="button" class="dist-modal-close"
                        id="dist-modal-close" aria-label="Chiudi">
                    <svg viewBox="0 0 24 24" width="14" height="14"
                         fill="none" stroke="currentColor"
                         stroke-width="2.4" stroke-linecap="round"
                         aria-hidden="true">
                        <line x1="5" y1="5" x2="19" y2="19"/>
                        <line x1="19" y1="5" x2="5" y2="19"/>
                    </svg>
                </button>
            </header>

            <div class="dist-modal-body">
                <div class="dist-row">
                    <span class="dist-label">Da</span>
                    <span class="dist-from" id="dist-from">—</span>
                </div>

                <div class="dist-row">
                    <span class="dist-label">A</span>
                    <div class="dist-to-wrap">
                        <select class="dist-select" id="dist-cat">
                            <!-- popolato da JS -->
                        </select>
                        <select class="dist-select" id="dist-poi">
                            <!-- popolato da JS in base alla categoria -->
                        </select>
                    </div>
                </div>

                <div class="dist-row">
                    <span class="dist-label">Con</span>
                    <div class="dist-modes" role="radiogroup"
                         aria-label="Mezzo di trasporto">
                        <button type="button" class="dist-mode-btn"
                                data-mode="walk" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="20" height="20"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="5" r="1"/>
                                <path d="m9 20 3-6 3 6"/>
                                <path d="m6 8 6 2 6-2"/>
                                <path d="M12 10v4"/>
                            </svg>
                            <span>A piedi</span>
                        </button>
                        <button type="button" class="dist-mode-btn is-active"
                                data-mode="car" aria-pressed="true">
                            <svg viewBox="0 0 24 24" width="20" height="20"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/>
                                <circle cx="6.5" cy="16.5" r="2.5"/>
                                <circle cx="16.5" cy="16.5" r="2.5"/>
                            </svg>
                            <span>Auto</span>
                        </button>
                        <button type="button" class="dist-mode-btn"
                                data-mode="train" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="20" height="20"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M8 3.1V7a4 4 0 0 0 8 0V3.1"/>
                                <path d="M9 15L8 14"/>
                                <path d="M15 15l1-1"/>
                                <path d="M9 19c-2.8 0-5-2.2-5-5v-4a8 8 0 0 1 16 0v4c0 2.8-2.2 5-5 5Z"/>
                                <path d="m8 19-2 3"/>
                                <path d="m16 19 2 3"/>
                            </svg>
                            <span>Treno</span>
                        </button>
                        <button type="button" class="dist-mode-btn"
                                data-mode="plane" aria-pressed="false">
                            <svg viewBox="0 0 24 24" width="20" height="20"
                                 fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round"
                                 stroke-linejoin="round" aria-hidden="true">
                                <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
                            </svg>
                            <span>Aereo</span>
                        </button>
                    </div>
                </div>

                <div class="dist-result" id="dist-result">
                    <div class="dist-result-km" id="dist-km">—</div>
                    <div class="dist-result-time" id="dist-time">Seleziona destinazione</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS (CDN ufficiale) -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>

    <!-- Menu di navigazione condiviso (caricato prima di app.js
         così è disponibile subito su tutte le pagine) -->
    <script src="menu.js"></script>

    <!-- Logica applicativa (deve venire DOPO leaflet.js) -->
    <script src="app.js"></script>
</body>
</html>
